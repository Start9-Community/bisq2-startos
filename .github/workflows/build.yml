name: Build

on:
  workflow_dispatch:
  pull_request:
    # Without ready_for_review, a PR opened as a draft gets no build when it is
    # marked ready — only on its next push.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['*.md']
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master
    # No DEV_KEY — a PR build doesn't publish, so it doesn't need the signing key.
