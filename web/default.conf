# Static server for the StartOS status/landing interface, plus a single health-probe proxy.
#
# SECURITY: this serves the static page under /usr/share/nginx/html and reverse-proxies EXACTLY
# ONE endpoint — the node's unauthenticated version endpoint — for the node-liveness health check.
# There is no route to the pairing file and no other API path is proxied, so this server still has
# no path to the pairing bearer token (which lives in a file surfaced via StartOS Properties, not
# the API). Modeled on the upstream bisq2 api-app config (apps/api-app/docker/qr-ui/nginx.conf).
server {
    listen 8091;
    listen [::]:8091;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # No request logging: this is a Java-PID1 container with no logrotate, so an unbounded
    # access.log (a holder of the onion URL could hammer requests) would grow until it fills disk.
    access_log off;

    # Security headers at server level (inherited by every location, since none defines its own
    # add_header). The page is all-inline, same-origin and has NO scripts, so the CSP is tight.
    #  - Referrer-Policy: the page is served from the node's unique .onion origin — never leak it
    #    as a Referer on outbound clicks (the links also carry rel="noreferrer").
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;

    # Node-liveness probe ONLY — reverse-proxied to the node's REST API on loopback (127.0.0.1:8090,
    # plain HTTP per api_app.conf). GET/HEAD only; the version endpoint carries no secret and this
    # exact-match location cannot reach any other API path. The StartOS `node-alive` health check
    # hits this and treats any non-5xx response as "node API is up" (see scripts/procedures).
    location = /api/v1/settings/version {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8090/api/v1/settings/version;
        proxy_set_header Host "localhost";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
