# Minimal static server for the StartOS status/landing interface.
#
# SECURITY: this serves ONLY the static page under /usr/share/nginx/html. There is deliberately no
# proxy_pass and no route to the node API or the pairing file, so — unlike the removed pairing UI —
# this server has no path to the pairing bearer token. It also cannot misreport node health: it
# returns its own static 200 and never proxies the node, so a node error can't surface here as a
# misleading status (the pairing-ready health check reads stats.yaml, not this server).
server {
    listen 8091;
    listen [::]:8091;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The page is served from the node's unique .onion origin, so never leak that origin as a
    # Referer on outbound clicks (browser defaults would send it on cross-origin navigation). The
    # links also carry rel="noreferrer"; this header covers browsers that ignore the attribute.
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
